name: Python tests

on:
  push:
    branches: [main]
    paths: ['tradingbot/**', 'tests/**', 'bots/**', 'requirements.txt', '.github/workflows/tests.yml']
  pull_request:
    paths: ['tradingbot/**', 'tests/**', 'bots/**', 'requirements.txt', '.github/workflows/tests.yml']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
