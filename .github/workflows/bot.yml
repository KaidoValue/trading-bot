# Lässt den Bot jede Stunde automatisch auf den Servern von GitHub laufen (kein eigener PC nötig).
# Der Stand (state/) und das Trade-Protokoll (logs/) werden danach ins Repository zurückgespeichert.
name: Trading-Bot stündlich

on:
  schedule:
    # Jede Stunde: prüft Stop-Loss, Nachrichten und Ereignisse. Das Kauf-/Verkaufssignal der Tageskerze
    # wird trotzdem nur einmal pro Tag ausgewertet (nach Schluss der Kerze um 00:00 UTC).
    # Verbrauch ca. 1-1,5 Minuten pro Lauf, also unter den 2000 Gratis-Minuten pro Monat für private Repos.
    - cron: "5 * * * *"
  workflow_dispatch: {}        # zusätzlich von Hand startbar (Actions -> Run workflow)

permissions:
  contents: write

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Bausteine installieren
        run: pip install -r requirements.txt

      - name: Bot einmal laufen lassen (Demo)
        run: python -m tradingbot paper --config config_langfrist.yaml --once

      - name: Stand anzeigen und in STATUS.md schreiben
        run: |
          {
            echo "# Stand des Trading-Bots (Demo)"
            echo
            echo "Letzte Aktualisierung: $(date -u '+%d.%m.%Y %H:%M') UTC"
            echo
            echo '```'
            python -m tradingbot status --config config_langfrist.yaml
            echo '```'
          } > STATUS.md
          cat STATUS.md

      - name: Stand speichern
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add STATUS.md state logs || true
          git diff --cached --quiet || git commit -m "Bot-Lauf $(date -u +%Y-%m-%d)"
          git push
