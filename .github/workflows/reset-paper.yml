name: Paper-Neustart

on:
  workflow_dispatch:
    inputs:
      capital:
        description: Startkapital in CHF je Paper-Bot und Chef
        required: true
        default: '100'

permissions:
  contents: write
  actions: read

concurrency:
  group: trading-bot
  cancel-in-progress: true

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Keine parallelen Handelsläufe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh run list --workflow bot.yml --status in_progress --json databaseId --jq 'length')
          test "$count" = 0 || { echo 'Bot läuft noch; Neustart abgebrochen'; exit 1; }
      - name: Tests vor dem Neustart
        run: python -m pytest -q tests/test_reset.py
      - name: Konten archivieren und neu starten
        env:
          RESET_CAPITAL: ${{ inputs.capital }}
        run: python -m scripts.reset_paper --capital "$RESET_CAPITAL"
      - name: Übersicht für den neuen Start aktualisieren
        run: |
          python -m tradingbot dashboard --bots bots/config_langfrist.yaml bots/config_daytrading.yaml bots/config_risiko.yaml --chef daten/state/chef.json
      - name: Trading-Oberfläche und Charts veröffentlichen
        run: |
          git config user.name 'trading-bot'
          git config user.email 'trading-bot@users.noreply.github.com'
          export GIT_INDEX_FILE="$(mktemp -u)"
          git --work-tree=daten/charts add -A .
          chart_commit=$(git commit-tree "$(git write-tree)" -m 'Paper-Neustart: neue Trading-Oberfläche')
          git push origin "$chart_commit:refs/heads/charts" --force
      - name: Neustart und Archiv atomar speichern
        run: |
          git config user.name 'trading-bot'
          git config user.email 'trading-bot@users.noreply.github.com'
          git add bots daten STATUS.md
          git commit -m 'Paper-Neustart: Konten und Chef mit neuem Startkapital, bisherige Ergebnisse archiviert'
          git push origin HEAD:main
