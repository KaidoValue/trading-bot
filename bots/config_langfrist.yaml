# Langfrist-Variante: Tageskerzen, wenige Trades, grosse Positionen.
# Benutzen mit:  py -3.13 -m tradingbot compare --config config_langfrist.yaml --days 2500
#
# Ein gemeinsames Konto für alle Coins. Höchstens 5 Coins gleichzeitig, je max. 10 %: zusammen höchstens die Hälfte investiert. Schwankungen von 10-20 % sind möglich,
# deshalb ist der Not-Aus erst bei 35 % Rückgang eingestellt.

mode: paper
title: "1️⃣ Langfrist-Bot (Hauptbot)"
description: "Schwerpunkt langfristig (200-Tage-Linie, Wochen bis Monate), handelt aber auch mittelfristig (4h) und kurzfristig (1h), long und short. Max. 50 % investiert."
exchange: kraken
symbols: ["BTC/CHF", "ETH/CHF", "BNB/CHF", "XRP/CHF", "SOL/CHF", "TRX/CHF", "ZEC/CHF", "HYPE/CHF"]   # BTC/ETH direkt in CHF, die anderen über USD umgerechnet (siehe data.Converted)
timeframe: 1d
history_exchange: bitstamp
history_symbol: BTC/USD
starting_capital: 1000
fee_rate: 0.0026
slippage: 0.0005

# Zeithorizonte: Jeder Bot darf kurzfristig (Daytrading), mittelfristig und langfristig handeln, long und short.
# Alle Horizonte teilen sich ein Konto. Pro Coin gibt es eine Position, die dem Horizont gehört, der sie eröffnet hat.
# share = Startanteil am investierbaren Kapital; mit adaptive_shares wandert Kapital zum Horizont, der zuletzt
# mehr verdient hat (je Horizont 10-70 %). Der erste bzw. main_horizon gilt für backtest/compare/status.
horizons:
  lang:                       # Hauptstil: 200-Tage-Linie, über der Linie long, darunter short
    timeframe: 1d
    strategy: regime
    strategy_params: {period: 200}
    share: 0.5
  mittel:                     # Trendfolge auf 4-Stunden-Kerzen, Tage bis Wochen
    timeframe: 4h
    strategy: trend
    share: 0.25
    stop_loss_atr: 3.0
    take_profit_atr: 6.0
    risk_per_trade: 0.02
  kurz:                       # Daytrading: lernende Gewichtung auf 1-Stunden-Kerzen
    timeframe: 1h
    strategy: adaptive
    share: 0.25
    stop_loss_atr: 2.0
    take_profit_atr: 4.0
    risk_per_trade: 0.01
adaptive_shares: true
allow_short: true            # auch auf fallende Kurse (nur Demo; live gesperrt)
poll_seconds: 300
reevaluate: true      # stündlich nachprüfen: wurde ein Einstieg z.B. wegen News verschoben, holt er ihn nach

use_news: true
news_refresh_minutes: 15
news_min_sources: 2
use_events: true
event_pause_minutes: 30
event_feeds: {}

risk:
  risk_per_trade: 0.05        # gilt für «lang»; Stop weit weg; die Grösse begrenzt ohnehin max_position_pct (ca. 4 % Risiko)
  stop_loss_atr: 8.0          # Notfall-Stop (ca. 25-30 % unter Einstieg)
  take_profit_atr: 1000       # kein festes Ziel: Ausstieg nur über das Signal
  max_position_pct: 0.10      # pro Coin
  max_invested_pct: 0.50      # alle Coins zusammen höchstens die Hälfte, der Rest bleibt in Cash
  max_daily_loss_pct: 0.15
  max_drawdown_pct: 0.35
  halt_days: 30              # nach Not-Aus 30 Tage Pause, dann geht es weiter
  min_order_value: 10
  max_total_risk_pct: 0.30
  max_open_positions: 8       # verteilt auf alle Horizonte
  max_trades_per_day: 10       # 8 Coins: mehrere Käufe am selben Tag möglich
  loss_streak_pause: 99
  pause_hours: 0
  max_spread_pct: 0.003
  correlation_limit: 0.8
