# Langfrist-Variante: Tageskerzen, wenige Trades, grosse Positionen.
# Benutzen mit:  py -3.13 -m tradingbot compare --config config_langfrist.yaml --days 2500
#
# Ein gemeinsames Konto für alle Coins. Je Coin höchstens 20 %, zusammen bis 100 % investiert (in der Simulation
# deutlich mehr Gewinn als mit max. 50 %, dafür Rückgänge bis ca. 50 %). Not-Aus bei 35 % Rückgang, dann 30 Tage Pause.

mode: paper
title: "1️⃣ Langfrist-Bot (Hauptbot)"
description: "Schwerpunkt langfristig (200-Tage-Linie, Wochen bis Monate), handelt auch mittelfristig (4h) und kurzfristig (1h), nur in Trendrichtung. Bis 100 % investiert, je Coin bis 20 %. Simulation 2011-2022: +58 %/Jahr, 2023-2026: +40 %/Jahr."
exchange: kraken
symbols: ["BTC/CHF", "ETH/CHF", "BNB/CHF", "XRP/CHF", "SOL/CHF", "TRX/CHF", "ZEC/CHF", "HYPE/CHF"]   # BTC/ETH direkt in CHF, die anderen über USD umgerechnet (siehe data.Converted)
timeframe: 1d
history_exchange: bitstamp
history_symbol: BTC/USD
starting_capital: 1000
fee_rate: 0.0026
slippage: 0.0005

# Zeithorizonte: Jeder Bot darf kurzfristig (Daytrading), mittelfristig und langfristig handeln.
# Alle Horizonte teilen sich ein Konto. Pro Coin gibt es eine Position; mit horizon_priority darf ein längerer
# Horizont die Position eines kürzeren übernehmen. share = Startanteil am investierbaren Kapital; mit adaptive_shares
# wandert Kapital zum Horizont, der zuletzt mehr verdient hat (10-70 %). Der erste Horizont gilt für backtest/status.
#
# Eingestellt nach der Geschichts-Simulation 2011-2026 (lernen/HISTORIE.md): gewählt nur nach 2011-2022, geprüft
# auf 2023-2026. trend_filter = nur in Richtung der 200-Tage-Linie, min_edge = Gebührenfilter,
# partial_atr = Teilgewinn mit Stop auf Einstand. Shorts lohnten sich in keiner Variante (Leihzinsen, Krypto steigt
# langfristig): allow_short ist aus, kann aber jederzeit eingeschaltet werden (dann mit short_probation: true).
horizons:
  lang:                       # Hauptstil: 200-Tage-Linie, investiert über der Linie
    timeframe: 1d
    strategy: regime
    strategy_params: {period: 200}
    share: 0.5
    trend_filter: true
  mittel:                     # Triple Screen (Elder) auf 4-Stunden-Kerzen, Tage bis Wochen
    timeframe: 4h
    strategy: buch_triple_screen
    share: 0.25
    stop_loss_atr: 3.0
    take_profit_atr: 6.0
    risk_per_trade: 0.02
    trend_filter: true
    partial_atr: 0.75         # Hälfte bei +0,75 ATR verkaufen, Rest mit Stop auf Einstand
    min_edge: 5               # nur wenn das erste Ziel mindestens 5x die Gebühren bringt
  kurz:                       # Daytrading: lernende Gewichtung auf 1-Stunden-Kerzen
    timeframe: 1h
    strategy: adaptive
    share: 0.25
    stop_loss_atr: 2.0
    take_profit_atr: 4.0
    risk_per_trade: 0.01
    trend_filter: true
    partial_atr: 0.75
    min_edge: 5
adaptive_shares: true
horizon_priority: true
allow_short: false           # Shorts verloren in der Simulation Geld; einschalten: true (nur Demo; live gesperrt)
short_probation: true        # falls eingeschaltet: Shorts erst klein, bis sie sich bewährt haben
poll_seconds: 300
reevaluate: true      # stündlich nachprüfen: wurde ein Einstieg z.B. wegen News verschoben, holt er ihn nach

use_news: true
news_refresh_minutes: 15
news_min_sources: 2
use_events: true
event_pause_minutes: 30
event_feeds: {}

risk:
  risk_per_trade: 0.05        # gilt für «lang»; Stop weit weg; die Grösse begrenzt ohnehin max_position_pct (ca. 4 % Risiko)
  stop_loss_atr: 8.0          # Notfall-Stop (ca. 25-30 % unter Einstieg)
  take_profit_atr: 1000       # kein festes Ziel: Ausstieg nur über das Signal
  max_position_pct: 0.20      # pro Coin
  max_invested_pct: 1.0       # alle Coins zusammen bis zum ganzen Kapital (Simulation: mehr Gewinn als mit 50 %)
  max_daily_loss_pct: 0.15
  max_drawdown_pct: 0.35
  halt_days: 30              # nach Not-Aus 30 Tage Pause, dann geht es weiter
  min_order_value: 10
  max_total_risk_pct: 1.0     # Grösse begrenzen max_position_pct und max_invested_pct
  max_open_positions: 8       # verteilt auf alle Horizonte
  max_trades_per_day: 10       # 8 Coins: mehrere Käufe am selben Tag möglich
  loss_streak_pause: 99
  pause_hours: 0
  max_spread_pct: 0.003
  correlation_limit: 0.8
