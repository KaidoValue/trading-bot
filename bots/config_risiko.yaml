# Risiko-Bot: sehr risikofreudig, viele Trades, auch auf fallende Kurse (Short). NUR DEMO mit Spielgeld.
# Dient als Vergleich: Zeigt, was passiert, wenn man aggressiv handelt. Für echtes Geld nicht geeignet.

mode: paper
title: "3️⃣ Risiko-Bot (aggressiv)"
description: "Sehr risikofreudig: viele Trades alle 30 Minuten, setzt auch auf fallende Kurse (Short), 5 % Risiko pro Trade, ignoriert Nachrichten."
exchange: kraken
symbols: ["BTC/CHF", "ETH/CHF", "BNB/CHF", "XRP/CHF", "SOL/CHF", "TRX/CHF", "ZEC/CHF", "HYPE/CHF"]
timeframe: 30m           # passt zum Takt auf GitHub (alle 30 Minuten)
history_exchange: bitstamp
history_symbol: BTC/USD
starting_capital: 1000
fee_rate: 0.0026
slippage: 0.0005

# Kurzer Donchian-Ausbruch: long nach einem 10-Kerzen-Hoch, short nach einem 5-Kerzen-Tief.
# hold: die Richtung bleibt bis zum Gegensignal bestehen -> der Bot ist praktisch immer im Markt
strategy: breakout
strategy_params:
  entry: 10
  exit: 5
  hold: true
allow_short: true        # auch auf fallende Kurse (nur Demo; live gesperrt)
poll_seconds: 60

use_news: false          # ignoriert Nachrichten und Ereignisse bewusst
use_events: false

risk:
  risk_per_trade: 0.05        # 5 % Risiko pro Trade (normal: 1 %)
  stop_loss_atr: 1.5          # enger Stop
  take_profit_atr: 3.0
  max_position_pct: 0.50      # bis zur Hälfte des Kapitals in einem Coin
  max_invested_pct: 1.0       # alles darf investiert sein
  max_daily_loss_pct: 0.50
  max_drawdown_pct: 0.90      # Not-Aus erst bei 90 % Verlust
  halt_days: 1
  min_order_value: 10
  max_total_risk_pct: 0.40
  max_open_positions: 6
  max_trades_per_day: 100
  loss_streak_pause: 99       # keine Pause nach Verlusten
  pause_hours: 0
  max_spread_pct: 0.01
  correlation_limit: 1.01     # keine Verkleinerung bei ähnlichen Coins
