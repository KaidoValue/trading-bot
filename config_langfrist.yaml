# Langfrist-Variante: Tageskerzen, wenige Trades, grosse Positionen.
# Benutzen mit:  py -3.13 -m tradingbot compare --config config_langfrist.yaml --days 2500
#
# Ein gemeinsames Konto für alle Coins. Höchstens 5 Coins gleichzeitig, je max. 10 %: zusammen höchstens die Hälfte investiert. Schwankungen von 10-20 % sind möglich,
# deshalb ist der Not-Aus erst bei 35 % Rückgang eingestellt.

mode: paper
title: "Langfrist-Bot (200-Tage-Regel, Hauptbot)"
exchange: kraken
symbols: ["BTC/CHF", "ETH/CHF", "BNB/CHF", "XRP/CHF", "SOL/CHF", "TRX/CHF", "ZEC/CHF", "HYPE/CHF"]   # BTC/ETH direkt in CHF, die anderen über USD umgerechnet (siehe data.Converted)
timeframe: 1d
history_exchange: bitstamp
history_symbol: BTC/USD
starting_capital: 1000
fee_rate: 0.0026
slippage: 0.0005

# regime = 200-Tage-Linie: investiert über der Linie, sonst Cash
strategy: regime
strategy_params:
  period: 200
allow_short: false
poll_seconds: 300
reevaluate: true      # stündlich nachprüfen: wurde ein Einstieg z.B. wegen News verschoben, holt er ihn nach

use_news: true
news_refresh_minutes: 15
news_min_sources: 2
use_events: true
event_pause_minutes: 30
event_feeds: {}

risk:
  risk_per_trade: 0.05        # Stop weit weg; die Grösse begrenzt ohnehin max_position_pct (ca. 4 % Risiko)
  stop_loss_atr: 8.0          # Notfall-Stop (ca. 25-30 % unter Einstieg)
  take_profit_atr: 1000       # kein festes Ziel: Ausstieg nur über das Signal
  max_position_pct: 0.10      # pro Coin
  max_invested_pct: 0.50      # alle Coins zusammen höchstens die Hälfte, der Rest bleibt in Cash
  max_daily_loss_pct: 0.15
  max_drawdown_pct: 0.35
  halt_days: 30              # nach Not-Aus 30 Tage Pause, dann geht es weiter
  min_order_value: 10
  max_total_risk_pct: 0.30
  max_open_positions: 5
  max_trades_per_day: 10       # 8 Coins: mehrere Käufe am selben Tag möglich
  loss_streak_pause: 99
  pause_hours: 0
  max_spread_pct: 0.003
  correlation_limit: 0.8
